<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
  :root {
    --bg: #eef2f7; --grid: #d9e1ec; --ink: #1e2a44; --muted: #5d6b85;
    --snake: #2f3e8f; --head: #1b255e; --apple: #e8553d; --panel: #ffffff;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12182a; --grid: #1c2540; --ink: #e8edf8; --muted: #93a0bd;
      --snake: #8fa2ff; --head: #c3ccff; --apple: #ff7a63; --panel: #1a2240;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12182a; --grid: #1c2540; --ink: #e8edf8; --muted: #93a0bd;
    --snake: #8fa2ff; --head: #c3ccff; --apple: #ff7a63; --panel: #1a2240;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 20px 16px 28px;
  }
  header { width: min(92vw, 420px); display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: .02em; }
  .score { font-size: 1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .score b { color: var(--ink); font-size: 1.25rem; }
  .stage { position: relative; width: min(92vw, 420px); }
  canvas {
    width: 100%; aspect-ratio: 1; display: block; background: var(--bg);
    border: 2px solid var(--ink); border-radius: 6px; touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
    background: color-mix(in srgb, var(--bg) 82%, transparent); border-radius: 6px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 1.4rem; }
  .overlay p { margin: 0; color: var(--muted); max-width: 26ch; line-height: 1.4; }
  button {
    font: inherit; cursor: pointer; color: var(--bg); background: var(--ink);
    border: 0; border-radius: 6px; padding: 10px 22px; font-weight: 700;
  }
  button:focus-visible { outline: 3px solid var(--apple); outline-offset: 2px; }
  .pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; }
  .pad button { padding: 0; font-size: 1.3rem; background: var(--panel); color: var(--ink); border: 2px solid var(--ink); }
  .pad .up { grid-column: 2; } .pad .left { grid-row: 2; grid-column: 1; }
  .pad .down { grid-row: 2; grid-column: 2; } .pad .right { grid-row: 2; grid-column: 3; }
  .hint { margin: 0; color: var(--muted); font-size: .9rem; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>Snake</h1>
    <div class="score">Score <b id="score">0</b> &nbsp; Best <b id="best">0</b></div>
  </header>

  <div class="stage">
    <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">Ready?</h2>
      <p id="msg">Eat the apples. Don’t hit the walls or yourself.</p>
      <button id="start">Play</button>
    </div>
  </div>

  <div class="pad" aria-label="On-screen controls">
    <button class="up" data-dir="up" aria-label="Up">▲</button>
    <button class="left" data-dir="left" aria-label="Left">◀</button>
    <button class="down" data-dir="down" aria-label="Down">▼</button>
    <button class="right" data-dir="right" aria-label="Right">▶</button>
  </div>
  <p class="hint">Arrow keys or WASD, swipe on the board, or tap the arrows.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const CELLS = 20, SIZE = canvas.width / CELLS;
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

let snake, dir, nextDir, apple, score, running, last = 0, acc = 0, stepMs;
let best = 0;
try { best = Number(localStorage.getItem("snake-best")) || 0; } catch (e) {}
document.getElementById("best").textContent = best;

function color(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = nextDir = "right"; score = 0; stepMs = 140;
  document.getElementById("score").textContent = 0;
  placeApple();
}

function placeApple() {
  do { apple = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) }; }
  while (snake.some(s => s.x === apple.x && s.y === apple.y));
}

// 1. INPUT: store the player’s wish; the game loop decides when to use it.
function turn(d) {
  const opposite = { up: "down", down: "up", left: "right", right: "left" };
  if (d !== opposite[dir]) nextDir = d;
}
const keys = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right" };
addEventListener("keydown", e => {
  const d = keys[e.key];
  if (d) { e.preventDefault(); turn(d); if (!running) begin(); }
});
document.querySelectorAll(".pad button").forEach(b =>
  b.addEventListener("click", () => { turn(b.dataset.dir); if (!running) begin(); }));
let t0 = null;
canvas.addEventListener("touchstart", e => { t0 = e.touches[0]; }, { passive: true });
canvas.addEventListener("touchend", e => {
  if (!t0) return;
  const dx = e.changedTouches[0].clientX - t0.clientX, dy = e.changedTouches[0].clientY - t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 20)
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  t0 = null;
});

// 2. UPDATE: advance the game state by one step.
function step() {
  dir = nextDir;
  const head = { x: snake[0].x + DIRS[dir][0], y: snake[0].y + DIRS[dir][1] };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();
  snake.unshift(head);
  if (head.x === apple.x && head.y === apple.y) {
    score++; stepMs = Math.max(70, stepMs - 4);
    document.getElementById("score").textContent = score;
    placeApple();
  } else {
    snake.pop();
  }
}

// 3. RENDER: clear the canvas and redraw everything.
function draw() {
  ctx.fillStyle = color("--bg"); ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = color("--grid"); ctx.lineWidth = 1;
  for (let i = 1; i < CELLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * SIZE); ctx.lineTo(canvas.width, i * SIZE); ctx.stroke();
  }
  ctx.fillStyle = color("--apple");
  ctx.beginPath(); ctx.arc((apple.x + .5) * SIZE, (apple.y + .5) * SIZE, SIZE * .38, 0, Math.PI * 2); ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = color(i === 0 ? "--head" : "--snake");
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
}

// THE GAME LOOP: runs before every screen refresh (about 60 times a second).
// The snake only moves every stepMs, so game speed doesn’t depend on screen speed.
function loop(now) {
  if (!running) return;
  acc += now - last; last = now;
  while (acc >= stepMs && running) { acc -= stepMs; step(); }
  draw();
  requestAnimationFrame(loop);
}

function begin() {
  reset();
  document.getElementById("overlay").classList.add("hidden");
  running = true; last = performance.now(); acc = 0;
  requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  if (score > best) {
    best = score; document.getElementById("best").textContent = best;
    try { localStorage.setItem("snake-best", String(best)); } catch (e) {}
  }
  document.getElementById("title").textContent = "Game over";
  document.getElementById("msg").textContent = "You scored " + score + ". Best is " + best + ".";
  document.getElementById("start").textContent = "Play again";
  document.getElementById("overlay").classList.remove("hidden");
}

document.getElementById("start").addEventListener("click", begin);
reset(); draw();
</script>
</body>
</html>
